name: terraform-deploy

on:
  push:
    branches: [main]
    paths:
      - 'stacks/staging/**'
      - 'modules/**'
      - 'env/staging/**'
      - '.github/workflows/terraform-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-1
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Resolve target environment
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="staging"
          fi

          echo "TARGET_ENV=$ENV" >> "$GITHUB_ENV"

          case "$ENV" in
            staging)
              echo "TF_DIR=stacks/staging" >> "$GITHUB_ENV"
              echo "TF_VARS=../../env/staging/dashboard-counting-stack.tfvars" >> "$GITHUB_ENV"
              echo "ROLE_ACCOUNT_SECRET=AWS_STAGING_ACCOUNT_ID" >> "$GITHUB_ENV"
              echo "ROLE_NAME_SECRET=AWS_TERRAFORM_ROLE_STAGING" >> "$GITHUB_ENV"
              ;;
            production)
              echo "TF_DIR=stacks/production" >> "$GITHUB_ENV"
              echo "TF_VARS=../../env/production/dashboard-counting-stack.tfvars" >> "$GITHUB_ENV"
              echo "ROLE_ACCOUNT_SECRET=AWS_PRODUCTION_ACCOUNT_ID" >> "$GITHUB_ENV"
              echo "ROLE_NAME_SECRET=AWS_TERRAFORM_ROLE_PRODUCTION" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported environment: $ENV" >&2
              exit 1
              ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets[env.ROLE_ACCOUNT_SECRET] }}:role/${{ secrets[env.ROLE_NAME_SECRET] }}
          aws-region: ap-southeast-1

      - name: Terraform format check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -reconfigure -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -var-file="${{ env.TF_VARS }}" -lock-timeout=5m -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.TARGET_ENV }}
          path: ${{ env.TF_DIR }}/tfplan

  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    env:
      AWS_REGION: ap-southeast-1
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Resolve target environment
        run: |
          ENV="${{ github.event.inputs.environment }}"
          echo "TARGET_ENV=$ENV" >> "$GITHUB_ENV"

          case "$ENV" in
            staging)
              echo "TF_DIR=stacks/staging" >> "$GITHUB_ENV"
              echo "TF_VARS=../../env/staging/dashboard-counting-stack.tfvars" >> "$GITHUB_ENV"
              echo "ROLE_ACCOUNT_SECRET=AWS_STAGING_ACCOUNT_ID" >> "$GITHUB_ENV"
              echo "ROLE_NAME_SECRET=AWS_TERRAFORM_ROLE_STAGING" >> "$GITHUB_ENV"
              ;;
            production)
              echo "TF_DIR=stacks/production" >> "$GITHUB_ENV"
              echo "TF_VARS=../../env/production/dashboard-counting-stack.tfvars" >> "$GITHUB_ENV"
              echo "ROLE_ACCOUNT_SECRET=AWS_PRODUCTION_ACCOUNT_ID" >> "$GITHUB_ENV"
              echo "ROLE_NAME_SECRET=AWS_TERRAFORM_ROLE_PRODUCTION" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported environment: $ENV" >&2
              exit 1
              ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets[env.ROLE_ACCOUNT_SECRET] }}:role/${{ secrets[env.ROLE_NAME_SECRET] }}
          aws-region: ap-southeast-1

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.TARGET_ENV }}
          path: ${{ env.TF_DIR }}

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -reconfigure -input=false

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false tfplan
