name: terraform-deploy

on:
  push:
    branches:
      - '**'
    paths:
      - 'stacks/**'
      - 'modules/**'
      - 'env/**'
      - '.github/workflows/terraform-deploy.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'stacks/**'
      - 'modules/**'
      - 'env/**'
      - '.github/workflows/terraform-deploy.yml'

permissions:
  contents: read

concurrency:
  group: terraform-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  TF_IN_AUTOMATION: 'true'

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform format
        run: terraform fmt -check -recursive

  validate:
    needs: format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - staging
          - production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform init
        working-directory: stacks/${{ matrix.environment }}
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: stacks/${{ matrix.environment }}
        run: terraform validate

  plan:
    needs:
      - format
      - validate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            plan_role_var: AWS_TERRAFORM_PLAN_ROLE_STAGING
          - environment: production
            plan_role_var: AWS_TERRAFORM_PLAN_ROLE_PRODUCTION

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars[matrix.plan_role_var] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: stacks/${{ matrix.environment }}
        run: terraform init -reconfigure -input=false

      - name: Terraform plan
        working-directory: stacks/${{ matrix.environment }}
        run: |
          terraform plan \
            -var-file="../../env/${{ matrix.environment }}/dashboard-counting-stack.tfvars" \
            -lock-timeout=5m \
            -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}-${{ github.run_id }}
          path: stacks/${{ matrix.environment }}/tfplan
          retention-days: 1

  apply-staging:
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-apply-staging
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download staging plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-staging-${{ github.run_id }}
          path: stacks/staging

      - name: Terraform init
        working-directory: stacks/staging
        run: terraform init -reconfigure -input=false

      - name: Terraform apply
        working-directory: stacks/staging
        run: terraform apply -input=false tfplan

  apply-production:
    needs:
      - plan
      - apply-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-apply-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download production plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-production-${{ github.run_id }}
          path: stacks/production

      - name: Terraform init
        working-directory: stacks/production
        run: terraform init -reconfigure -input=false

      - name: Terraform apply
        working-directory: stacks/production
        run: terraform apply -input=false tfplan
