name: terraform-deploy

on:
  push:
    branches:
      - main
    paths:
      - 'stacks/staging/**'
      - 'modules/**'
      - 'env/staging/**'
      - '.github/workflows/terraform-deploy.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  TF_IN_AUTOMATION: 'true'

jobs:

  plan:
    runs-on: ubuntu-latest

    # For now push = staging.
    # Manual workflow = selected environment.
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Resolve environment
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          else
            ENV="staging"
          fi

          echo "TARGET_ENV=$ENV" >> "$GITHUB_ENV"

          case "$ENV" in
            staging)
              echo "TF_DIR=stacks/staging" >> "$GITHUB_ENV"
              echo "TF_VARS=../../env/staging/dashboard-counting-stack.tfvars" >> "$GITHUB_ENV"
              ;;

            production)
              echo "TF_DIR=stacks/production" >> "$GITHUB_ENV"
              echo "TF_VARS=../../env/production/dashboard-counting-stack.tfvars" >> "$GITHUB_ENV"
              ;;

            *)
              echo "Unsupported environment: $ENV"
              exit 1
              ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Terraform format
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -reconfigure -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var-file="${{ env.TF_VARS }}" \
            -lock-timeout=5m \
            -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.TARGET_ENV }}-${{ github.run_id }}
          path: ${{ env.TF_DIR }}/tfplan

  apply:
    needs: plan

    if: github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Resolve environment
        run: |
          ENV="${{ inputs.environment }}"

          echo "TARGET_ENV=$ENV" >> "$GITHUB_ENV"

          case "$ENV" in
            staging)
              echo "TF_DIR=stacks/staging" >> "$GITHUB_ENV"
              ;;

            production)
              echo "TF_DIR=stacks/production" >> "$GITHUB_ENV"
              ;;

            *)
              echo "Unsupported environment: $ENV"
              exit 1
              ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.TARGET_ENV }}-${{ github.run_id }}
          path: ${{ env.TF_DIR }}

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -reconfigure -input=false

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false tfplan