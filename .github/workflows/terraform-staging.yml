name: terraform-staging

on:
  pull_request:
    paths:
      - 'stacks/staging/**'
      - 'modules/**'
      - 'env/staging/**'
      - '.github/workflows/terraform-staging.yml'
  push:
    branches: [main]
    paths:
      - 'stacks/staging/**'
      - 'modules/**'
      - 'env/staging/**'
      - '.github/workflows/terraform-staging.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-staging
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stacks/staging
    env:
      AWS_REGION: ap-southeast-1
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -reconfigure -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -var-file="../../env/staging/dashboard-counting-stack.tfvars" -lock-timeout=5m -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging
          path: stacks/staging/tfplan

  apply:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: stacks/staging
    env:
      AWS_REGION: ap-southeast-1
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-staging
          path: stacks/staging

      - name: Terraform init
        run: terraform init -reconfigure -input=false

      - name: Terraform apply
        run: terraform apply -input=false tfplan
