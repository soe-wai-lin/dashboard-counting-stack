name: Terraform Production

on:
  push:
    branches:
      - '**'
    paths:
      - 'stacks/production/**'
      - 'modules/**'
      - 'env/production/**'
      - '.github/workflows/terraform-production.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'stacks/production/**'
      - 'modules/**'
      - 'env/production/**'
      - '.github/workflows/terraform-production.yml'

permissions:
  contents: read

concurrency:
  group: terraform-production-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  TF_IN_AUTOMATION: 'true'

jobs:
  production-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: stacks/production
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: stacks/production
        run: terraform validate

  production-plan:
    needs: production-validate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PRODUCTION_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: stacks/production
        run: terraform init -reconfigure -input=false

      - name: Terraform plan
        working-directory: stacks/production
        run: |
          terraform plan \
            -lock-timeout=5m \
            -out=tfplan

      - name: Upload production plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-production-${{ github.run_id }}
          path: stacks/production/tfplan
          retention-days: 1

  production-apply:
    needs: production-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-apply-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PRODUCTION_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download production plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-production-${{ github.run_id }}
          path: stacks/production

      - name: Terraform init
        working-directory: stacks/production
        run: terraform init -reconfigure -input=false

      # - name: Terraform apply
      #   working-directory: stacks/production
      #   run: terraform apply -input=false tfplan

      - name: Terraform destroy
        working-directory: stacks/production
        run: terraform destroy -input=false tfplan
