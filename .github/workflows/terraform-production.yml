name: terraform-production

on:
  pull_request:
    paths:
      - 'stacks/production/**'
      - 'modules/**'
      - 'env/production/**'
      - '.github/workflows/terraform-production.yml'
  push:
    branches: [main]
    paths:
      - 'stacks/production/**'
      - 'modules/**'
      - 'env/production/**'
      - '.github/workflows/terraform-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stacks/production
    env:
      AWS_REGION: ap-southeast-1
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_PRODUCTION_ACCOUNT_ID }}:role/${{ secrets.AWS_TERRAFORM_ROLE_PRODUCTION }}
          aws-region: ap-southeast-1

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -reconfigure -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -var-file="../../env/production/dashboard-counting-stack.tfvars" -lock-timeout=5m -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-production
          path: stacks/production/tfplan

  apply:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: stacks/production
    env:
      AWS_REGION: ap-southeast-1
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_PRODUCTION_ACCOUNT_ID }}:role/${{ secrets.AWS_TERRAFORM_ROLE_PRODUCTION }}
          aws-region: ap-southeast-1

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-production
          path: stacks/production

      - name: Terraform init
        run: terraform init -reconfigure -input=false

      - name: Terraform apply
        run: terraform apply -input=false tfplan
