name: Terraform Production

on:
  push:
    branches:
      # - '**'
      - 'production'
      - 'main'
    paths:
      - 'stacks/production/**'
      - 'modules/**'
      - 'env/production/**'
      - '.github/workflows/terraform-production.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'stacks/production/**'
      - 'modules/**'
      - 'env/production/**'
      - '.github/workflows/terraform-production.yml'

permissions:
  contents: read

concurrency:
  group: terraform-production-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  TF_IN_AUTOMATION: 'true'

jobs:
  Production-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: stacks/production
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: stacks/production
        run: terraform validate

  Production-tflint:
    name: Production TFLint
    needs: Production-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read 

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
          cache: true

      - name: Initialize TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: TFLint - Production Stack
        run: tflint --config="${GITHUB_WORKSPACE}/.tflint.hcl" --format=compact
        working-directory: stacks/production

      - name: TFLint - Shared Modules
        run: tflint --recursive --config="${GITHUB_WORKSPACE}/.tflint.hcl" --format=compact
        working-directory: modules

      - name: TFLint - Production Environment
        run: tflint --config="${GITHUB_WORKSPACE}/.tflint.hcl" --format=compact
        working-directory: stacks/production

  Production-security:
    name: Production DevSecOps Scan
    runs-on: ubuntu-latest
    needs: 
      - Production-validate
    permissions:
      contents: read

    steps:
     - name: Checkout
       uses: actions/checkout@v7
       with:
        fetch-depth: 0

     - name: Gitleaks Secret Scan
       uses: gitleaks/gitleaks-action@v3
       env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    #  - name: Install Checkov
    #    run: |
    #      python -m pip install --upgrade pip
    #      pip install checkov

    #  - name: Checkov - Production Terraform
    #    run: |
    #      checkov \
    #        -d stacks/production \
    #        --framework terraform

    #  - name: Checkov - Shared Terraform Modules
    #    run: |
    #      checkov \
    #        -d modules \
    #        --framework terraform

    #  - name: Install Trivy
    #    uses: aquasecurity/trivy-action@v0.36.0
    #    with:
    #      scan-type: 'fs'
    #      scan-ref: '.'
    #      cache: 'false'
       
    #  - name: Trivy - Production IaC Scan
    #    run: |
    #      trivy config \
    #        --severity HIGH,CRITICAL \
    #        --exit-code 1 \
    #        stacks/production

    #  - name: Trivy - Shared Modules Scan
    #    run: |
    #      trivy config \
    #        --severity HIGH,CRITICAL \
    #        --exit-code 1 \
    #        modules

  Production-plan:
    needs: 
      - Production-security
      - Production-tflint
    # if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PRODUCTION_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: stacks/production
        run: terraform init -reconfigure -input=false

      - name: Terraform plan
        working-directory: stacks/production
        run: |
          terraform plan \
            -lock-timeout=5m \
            -out=tfplan

      - name: Upload production plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-production-${{ github.run_id }}
          path: stacks/production/tfplan
          retention-days: 1

  Production-apply:
    needs: Production-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-apply-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PRODUCTION_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download production plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-production-${{ github.run_id }}
          path: stacks/production

      - name: Terraform init
        working-directory: stacks/production
        run: terraform init -reconfigure -input=false

      - name: Terraform apply
        working-directory: stacks/production
        run: terraform apply -input=false tfplan

